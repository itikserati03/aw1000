name: Bina APK ITIK SERATI

on:
  workflow_dispatch:
  push:
    paths:
      - 'ITIK-SERATI/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kod projek
        uses: actions/checkout@v4

      - name: Pasang Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Bina APK
        working-directory: ITIK-SERATI
        run: bash ./gradlew assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: ITIK-SERATI-debug-apk
          path: ITIK-SERATI/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
